name: Kingfisher Monitor

on:
  schedule:
    # 日本時間(JST)の 8:00 〜 20:00 の間、2時間おきに実行する設定
    # ※GitHub ActionsのCronはUTC（世界標準時）のため、JSTからマイナス9時間して指定します。
    - cron: '0 23,1,3,5,7,9,11 * * *'
  workflow_dispatch: # 手動実行用ボタンを有効化

permissions:
  contents: write # history.jsonをコミットするために必要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      run: python monitor.py

    - name: Commit and Push history.json
      # スクリプト実行により history.json に差分が出た場合のみ、自動でリポジトリに変更をコミット＆プッシュします
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add history.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update history.json via Actions"
        git push
